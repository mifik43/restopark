<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камеры видеонаблюдения</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0f1a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); margin-bottom: 30px; }
        .cameras-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1200px;
        }
        .camera-link {
            background: #2c3e50;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .camera-link:hover {
            background: #3d566e;
        }
        .back-btn {
            margin-top: 40px;
            padding: 15px 30px;
            background: #4a5568;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>📷 Камеры видеонаблюдения</h1>
    <div class="cameras-list">
        {% for cam in cameras %}
            <a href="/camera/{{ cam.id }}" class="camera-link">{{ cam.name }}</a>
        {% endfor %}
    </div>
    <a href="/" class="back-btn">← На главную</a>
</body>
</html>
