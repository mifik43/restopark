<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камеры видеонаблюдения</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0f1a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { font-size: 2.5rem; margin-bottom: 30px; }
        .cameras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }
        .camera-card {
            background: #1e1e2f;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .camera-title {
            padding: 12px 16px;
            font-size: 1.2rem;
            font-weight: bold;
            background: #2c2c3e;
            display: flex;
            justify-content: space-between;
        }
        .camera-stream {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }
        .camera-stream canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .back-btn {
            margin-top: 40px;
            padding: 15px 30px;
            background: #4a5568;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>📷 Камеры видеонаблюдения</h1>
    <div class="cameras-grid" id="camerasGrid"></div>
    <a href="/" class="back-btn">← На главную</a>

    <script>
        const cameras = [
            { name: 'Парковка', location: 'Улица' },
            { name: 'Зал ресторана', location: 'Основной зал' },
            { name: 'Кухня', location: 'Производство' },
            { name: 'Детская комната', location: '2 этаж' }
        ];

        function buildCameras() {
            const grid = document.getElementById('camerasGrid');
            cameras.forEach((cam, index) => {
                const card = document.createElement('div');
                card.className = 'camera-card';
                card.innerHTML = `
                    <div class="camera-title">
                        <span>${cam.name}</span>
                        <small>${cam.location}</small>
                    </div>
                    <div class="camera-stream">
                        <canvas id="cam${index}" width="640" height="360"></canvas>
                    </div>
                `;
                grid.appendChild(card);
                startFakeStream(document.getElementById(`cam${index}`), index);
            });
        }

        function startFakeStream(canvas, idx) {
            const ctx = canvas.getContext('2d');
            function draw() {
                const hue = (idx * 60 + Date.now() / 100) % 360;
                ctx.fillStyle = `hsl(${hue}, 40%, 15%)`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                for (let i=0; i<50; i++) {
                    ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);
                }
                ctx.fillStyle = 'white';
                ctx.font = '14px monospace';
                ctx.fillText(new Date().toLocaleTimeString(), 20, 40);
                ctx.fillText(`Камера ${idx+1} • Эмуляция`, 20, 60);
                requestAnimationFrame(draw);
            }
            draw();
        }

        buildCameras();
    </script>
</body>
</html>
