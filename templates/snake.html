<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐍 Змейка</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0a1f0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            touch-action: none;
        }
        .game-container {
            text-align: center;
            background: #1a3a1a;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 10px 0 #0a2a0a;
        }
        canvas {
            background: #000;
            border: 3px solid #2e8b57;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            height: auto;
            touch-action: none;
        }
        .score {
            color: #9f9;
            font-size: 28px;
            margin: 10px 0;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        button {
            background: #2e8b57;
            border: none;
            color: white;
            font-size: 20px;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            box-shadow: 0 5px 0 #1b5e20;
            transition: 0.1s;
            cursor: pointer;
            border: 2px solid #9f9;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: none;
        }
        .back-link {
            color: #cfc;
            margin-top: 15px;
            display: block;
            text-decoration: none;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="score">🍎 <span id="scoreDisplay">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">
        <button id="restartBtn">🔄 Заново</button>
    </div>
    <a href="/games" class="back-link">← К списку игр</a>
</div>
<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            {x: 10, y: 10}
        ];
        let direction = {x: 0, y: 0};
        let food = {};
        let score = 0;
        let gameLoop;
        let gameActive = true;

        function randomFood() {
            return {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Еда
            ctx.fillStyle = '#ff3333';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize-2, gridSize-2);

            // Змейка
            ctx.fillStyle = '#4caf50';
            for (let segment of snake) {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize-2, gridSize-2);
            }

            // Голова
            ctx.fillStyle = '#8bc34a';
            ctx.fillRect(snake[0].x * gridSize, snake[0].y * gridSize, gridSize-2, gridSize-2);
        }

        function update() {
            if (!gameActive) return;

            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

            // Проверка столкновения со стенами
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Проверка столкновения с собой
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Съели еду?
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreSpan.textContent = score;
                food = randomFood();
                // Убедимся, что еда не появилась на змейке
                while (snake.some(s => s.x === food.x && s.y === food.y)) {
                    food = randomFood();
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function gameOver() {
            gameActive = false;
            clearInterval(gameLoop);
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 24px "Segoe UI"';
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width/2, canvas.height/2);
        }

        function changeDirection(newDir) {
            if (!gameActive) return;
            // Запрет разворота на 180
            if ((direction.x === 0 && newDir.x !== 0) || (direction.y === 0 && newDir.y !== 0)) {
                direction = newDir;
            }
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            direction = {x: 0, y: 0};
            score = 0;
            scoreSpan.textContent = '0';
            gameActive = true;
            food = randomFood();
            while (snake.some(s => s.x === food.x && s.y === food.y)) {
                food = randomFood();
            }
            draw();
            clearInterval(gameLoop);
            gameLoop = setInterval(update, 100);
        }

        // Управление с клавиатуры
        window.addEventListener('keydown', (e) => {
            e.preventDefault();
            switch(e.key) {
                case 'ArrowUp': changeDirection({x: 0, y: -1}); break;
                case 'ArrowDown': changeDirection({x: 0, y: 1}); break;
                case 'ArrowLeft': changeDirection({x: -1, y: 0}); break;
                case 'ArrowRight': changeDirection({x: 1, y: 0}); break;
            }
        });

        // Сенсорное управление (свайпы)
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        });

        canvas.addEventListener('touchmove', (e) => e.preventDefault());

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!gameActive) return;
            const touch = e.changedTouches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                changeDirection({x: dx > 0 ? 1 : -1, y: 0});
            } else {
                changeDirection({x: 0, y: dy > 0 ? 1 : -1});
            }
        });

        document.getElementById('restartBtn').addEventListener('click', resetGame);

        // Старт
        resetGame();
    })();
</script>
</body>
</html>
