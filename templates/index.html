<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>RESTOPARK — Самара</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            touch-action: manipulation;
        }
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: white;
            margin-bottom: 15px;
            font-size: clamp(2rem, 6vw, 3rem);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .subtitle {
            color: #ccc;
            font-size: clamp(1rem, 3vw, 1.3rem);
            margin-bottom: 40px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: clamp(30px, 5vw, 40px) 20px;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: bold;
            text-decoration: none;
            color: white;
            border-radius: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 5px 10px rgba(0,0,0,0.3); }
        .btn-menu { background: #d32f2f; }
        .btn-cartoons { background: #f39c12; }
        .btn-games { background: #27ae60; }
        .btn-cameras { background: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать в RESTOPARK!</h1>
        <p class="subtitle">г. Самара, Южное шоссе, 5</p>
        <div class="buttons">
            <a href="/menu" class="btn btn-menu">🍽️ Меню</a>
            <a href="/cartoons" class="btn btn-cartoons">📺 Мультфильмы</a>
            <a href="/games" class="btn btn-games">🎮 Игры</a>
            <a href="/cameras" class="btn btn-cameras">📷 Камеры</a>
        </div>
    </div>
</body>
</html>
