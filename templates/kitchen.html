<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Кухня — Заказы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1e1e2f; color: white; padding: 20px; }
        .order-card { background: #2c2c3e; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .order-number { font-size: 2rem; font-weight: bold; color: #ffd966; }
        .order-time { font-size: 0.9rem; color: #aaa; }
        .order-items { margin: 15px 0; }
        .status-badge { font-size: 1rem; padding: 5px 15px; border-radius: 20px; }
        .status-confirmed { background: #f39c12; }
        .status-cooking { background: #3498db; }
        .status-ready { background: #27ae60; }
        .btn-action { margin-right: 10px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1>👨‍🍳 Кухня — Активные заказы</h1>
        <div id="ordersContainer">Загрузка...</div>
    </div>

    <script>
        function loadOrders() {
            fetch('/api/orders/active')
                .then(res => res.json())
                .then(orders => {
                    const container = document.getElementById('ordersContainer');
                    if (orders.length === 0) {
                        container.innerHTML = '<p>Нет активных заказов</p>';
                        return;
                    }
                    container.innerHTML = orders.map(order => `
                        <div class="order-card" id="order-${order.id}">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="order-number">#${order.order_number}</span>
                                <span class="order-time">${new Date(order.created_at).toLocaleTimeString()}</span>
                            </div>
                            <div class="order-items">
                                ${order.items.map(item => `
                                    <div>${item.name} x${item.quantity} — ${item.price}₽</div>
                                `).join('')}
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <span>Подача: ${order.serve_time === 'now' ? 'сразу' : 'позже'}</span>
                                <span class="status-badge status-${order.status}">${order.status}</span>
                            </div>
                            <div class="mt-3">
                                ${order.status === 'confirmed' 
                                    ? `<button class="btn btn-primary btn-action" onclick="updateStatus(${order.id}, 'cooking')">Начать готовку</button>`
                                    : order.status === 'cooking'
                                    ? `<button class="btn btn-success btn-action" onclick="updateStatus(${order.id}, 'ready')">Готово</button>`
                                    : `<button class="btn btn-info btn-action" onclick="updateStatus(${order.id}, 'completed')">Выдано</button>`
                                }
                            </div>
                        </div>
                    `).join('');
                });
        }

        function updateStatus(orderId, status) {
            fetch(`/api/order/${orderId}/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: status })
            })
            .then(res => res.json())
            .then(() => loadOrders());
        }

        loadOrders();
        setInterval(loadOrders, 5000); // обновление каждые 5 секунд
    </script>
</body>
</html>
