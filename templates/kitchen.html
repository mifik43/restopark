<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Кухня — Активные заказы и запросы помощи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1e1e2f; color: white; padding: 20px; }
        .order-card { background: #2c2c3e; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .order-number { font-size: 2rem; font-weight: bold; color: #ffd966; }
        .order-time { font-size: 0.9rem; color: #aaa; }
        .order-items { margin: 15px 0; }
        .status-badge { font-size: 1rem; padding: 5px 15px; border-radius: 20px; display: inline-block; }
        .status-confirmed { background: #f39c12; color: #000; }
        .status-cooking { background: #3498db; color: #fff; }
        .status-ready { background: #27ae60; color: #fff; }
        .status-completed { background: #aaa; color: #333; }
        .btn-action { margin-right: 10px; min-width: 180px; font-size: 1.1rem; }
        .help-card { background: #3c3c4e; border-left: 5px solid #ffc107; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .help-table { font-size: 1.1rem; }
        @media (max-width: 576px) {
            .order-number { font-size: 1.6rem; }
            .btn-action { min-width: auto; width: 100%; margin-bottom: 10px; }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1>👨‍🍳 Кухня — Активные заказы и запросы помощи</h1>

        <!-- Блок запросов помощи -->
        <div class="card bg-dark mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0">🆘 Запросы помощи</h4>
                <span class="badge bg-warning text-dark" id="helpCount">0</span>
            </div>
            <div class="card-body" id="helpRequestsContainer">
                <p class="text-muted">Нет активных запросов</p>
            </div>
        </div>

        <!-- Блок заказов -->
        <div class="card bg-dark">
            <div class="card-header">
                <h4 class="mb-0">📦 Заказы</h4>
            </div>
            <div class="card-body" id="ordersContainer">
                <p class="text-muted">Загрузка...</p>
            </div>
        </div>
    </div>

    <script>
        // Словари перевода статусов заказов
        const statusLabels = {
            'confirmed': 'Принят',
            'cooking': 'Готовится',
            'ready': 'Готов',
            'completed': 'Выдан',
            'paid': 'Оплачен'
        };

        const actionButtons = {
            'confirmed': { label: 'Начать готовить', nextStatus: 'cooking', btnClass: 'btn-primary' },
            'cooking':   { label: 'Готово', nextStatus: 'ready', btnClass: 'btn-success' },
            'ready':     { label: 'Выдано', nextStatus: 'completed', btnClass: 'btn-info' }
        };

        // ======= Заказы =======
        function loadOrders() {
            fetch('/api/orders/active')
                .then(res => res.json())
                .then(orders => {
                    const container = document.getElementById('ordersContainer');
                    if (orders.length === 0) {
                        container.innerHTML = '<p class="text-muted">Нет активных заказов</p>';
                        return;
                    }
                    container.innerHTML = orders.map(order => {
                        const statusText = statusLabels[order.status] || order.status;
                        const action = actionButtons[order.status];
                        const buttonHtml = action 
                            ? `<button class="btn ${action.btnClass} btn-action" onclick="updateOrderStatus(${order.id}, '${action.nextStatus}')">${action.label}</button>`
                            : '';
                        return `
                        <div class="order-card" id="order-${order.id}">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="order-number">#${order.order_number}</span>
                                <span class="order-time">${new Date(order.created_at).toLocaleTimeString('ru-RU')}</span>
                            </div>
                            <div class="order-items">
                                ${order.items.map(item => `
                                    <div class="d-flex justify-content-between">
                                        <span>${item.name} x${item.quantity}</span>
                                        <span>${item.price * item.quantity} ₽</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <span>Подача: ${order.serve_time === 'now' ? 'сразу' : 'позже'}</span>
                                <span class="status-badge status-${order.status}">${statusText}</span>
                            </div>
                            <div class="mt-3">
                                ${buttonHtml}
                            </div>
                        </div>`;
                    }).join('');
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('ordersContainer').innerHTML = '<p class="text-danger">Ошибка загрузки заказов</p>';
                });
        }

        function updateOrderStatus(orderId, status) {
            fetch(`/api/order/${orderId}/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: status })
            })
            .then(res => res.json())
            .then(() => loadOrders())
            .catch(err => console.error(err));
        }

        // ======= Запросы помощи =======
        function loadHelpRequests() {
            fetch('/api/help/requests/active')
                .then(res => res.json())
                .then(requests => {
                    const container = document.getElementById('helpRequestsContainer');
                    const countSpan = document.getElementById('helpCount');
                    countSpan.textContent = requests.length;
                    if (requests.length === 0) {
                        container.innerHTML = '<p class="text-muted">Нет активных запросов</p>';
                        return;
                    }
                    container.innerHTML = requests.map(req => {
                        const time = new Date(req.created_at).toLocaleTimeString('ru-RU');
                        const tableInfo = req.table_number ? `Стол: ${req.table_number}` : 'Без указания стола';
                        return `
                        <div class="help-card" id="help-${req.id}">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong>${tableInfo}</strong>
                                    <br><small class="text-light">${time}</small>
                                </div>
                                <button class="btn btn-sm btn-outline-warning" onclick="resolveHelp(${req.id})">Принято</button>
                            </div>
                        </div>`;
                    }).join('');
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('helpRequestsContainer').innerHTML = '<p class="text-danger">Ошибка загрузки запросов</p>';
                });
        }

        function resolveHelp(requestId) {
            fetch(`/api/help/request/${requestId}/resolve`, {
                method: 'POST'
            })
            .then(res => res.json())
            .then(() => {
                loadHelpRequests();
            })
            .catch(err => console.error(err));
        }

        // ======= Инициализация =======
        loadOrders();
        loadHelpRequests();
        setInterval(() => {
            loadOrders();
            loadHelpRequests();
        }, 5000);
    </script>
</body>
</html>
