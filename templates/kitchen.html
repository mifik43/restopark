<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кухня Скандика · Меню ресторана</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #3a281f, #1a120b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .kitchen-3d {
            background: #4d3a28;
            padding: 30px;
            border-radius: 70px 70px 30px 30px;
            box-shadow: 0 40px 0 #2b1f15, 0 60px 50px rgba(0,0,0,0.7);
            transform: rotateX(2deg) rotateY(1deg);
            border-bottom: 8px solid #ab8e64;
            max-width: 1200px;
            width: 100%;
        }
        .header {
            background: #7c5f45;
            border-radius: 50px;
            padding: 25px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffecb3;
            text-shadow: 3px 3px 0 #4d3a28;
            box-shadow: inset 0 -5px 0 #5e4532, 0 10px 15px black;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .balance {
            font-size: 48px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
            background: #2f2a1f;
            padding: 10px 30px;
            border-radius: 60px;
            box-shadow: inset 0 -3px 0 #15100a;
        }
        .kitchen-title {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 4px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }
        .dish-card {
            background: #f7e9d7;
            border-radius: 40px;
            padding: 20px;
            transform: translateY(0) rotateZ(0deg);
            box-shadow: 0 20px 0 #9b7e62, 0 30px 30px rgba(0,0,0,0.5);
            transition: 0.15s linear;
            border: 3px solid #ffe1a8;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }
        .dish-card:active {
            transform: translateY(10px);
            box-shadow: 0 10px 0 #9b7e62, 0 30px 30px black;
        }
        .dish-emoji {
            font-size: 90px;
            filter: drop-shadow(5px 15px 5px #7f5d40);
            margin-bottom: 5px;
        }
        .dish-name {
            font-size: 28px;
            font-weight: 800;
            color: #3b281b;
            margin: 10px 0 5px;
        }
        .dish-price {
            font-size: 36px;
            color: #d4a13e;
            text-shadow: 2px 2px 0 #7f5d40;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #3d2e1e;
            padding: 8px 20px;
            border-radius: 50px;
            color: #ffd966;
            margin: 15px 0 10px;
        }
        .dish-desc {
            font-size: 16px;
            color: #634e38;
            background: #efe0cd;
            padding: 10px;
            border-radius: 30px;
        }
        .buy-btn {
            background: #a36d3b;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 26px;
            padding: 15px 0;
            width: 100%;
            border-radius: 60px;
            margin-top: 15px;
            box-shadow: 0 8px 0 #6b4525;
            transition: 0.07s;
            cursor: pointer;
        }
        .buy-btn:active {
            transform: translateY(8px);
            box-shadow: none;
        }
        .buy-btn:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: 0 5px 0 #6b4525;
            pointer-events: none;
        }
        .back-link {
            display: block;
            text-align: center;
            margin: 40px 0 10px;
            color: #ffdbb5;
            font-size: 28px;
            text-decoration: none;
            background: #59412e;
            padding: 18px;
            border-radius: 60px;
            border: 2px solid #b39264;
        }
        .note {
            color: #ffd966;
            font-size: 20px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="kitchen-3d">
        <div class="header">
            <div class="balance">
                <span>🍽️</span>
                <span id="kitchenBalance">0</span>
            </div>
            <div class="kitchen-title">СКАНДИ-КУХНЯ</div>
        </div>

        <div class="menu-grid" id="menuContainer">
            <!-- Карточки будут сгенерированы JS -->
        </div>

        <div class="note">💰 Здесь можно потратить монеты, собранные в игре "Побег Скандика"</div>

        <a href="games.html" class="back-link">⬅ ВЕРНУТЬСЯ К ИГРЕ</a>
    </div>

    <script>
        (function() {
            // Данные блюд из ресторанного меню (взяты из menuData)
            const dishes = [
                { id: 1, name: 'Вафли гонконские', emoji: '🧇', price: 10, desc: 'Со взбитыми сливками и мороженым' },
                { id: 2, name: 'Пицца Маргарита', emoji: '🍕', price: 15, desc: 'Томатная основа, моцарелла, помидоры' },
                { id: 3, name: 'Картошка фри', emoji: '🍟', price: 5, desc: 'Хрустящая, с соусом' },
                { id: 4, name: 'Молочный коктейль', emoji: '🥤', price: 8, desc: 'Клубничный/ванильный/шоколадный' },
                { id: 5, name: 'Чизкейк', emoji: '🍰', price: 12, desc: 'Нежный, с манго или классический' },
                { id: 6, name: 'Корн дог', emoji: '🌭', price: 7, desc: 'Сосиска в кукурузном тесте' }
            ];

            const menuContainer = document.getElementById('menuContainer');
            const balanceSpan = document.getElementById('kitchenBalance');

            let skandiCoins = 0;

            // Загрузка монет из localStorage (ключ skandiCoins)
            function loadMoney() {
                try {
                    const saved = localStorage.getItem('skandiCoins');
                    skandiCoins = saved ? parseInt(saved, 10) : 0;
                } catch (e) {
                    skandiCoins = 0;
                }
                balanceSpan.textContent = skandiCoins;
            }

            // Сохранение монет
            function saveMoney() {
                try {
                    localStorage.setItem('skandiCoins', skandiCoins);
                } catch (e) {}
                balanceSpan.textContent = skandiCoins;
            }

            // Покупка
            function buyDish(price, dishName) {
                if (skandiCoins >= price) {
                    skandiCoins -= price;
                    saveMoney();
                    alert(`🍽️ Вы купили: ${dishName}! Приятного аппетита! (остаток: ${skandiCoins} монет)`);
                } else {
                    alert(`😕 Не хватает монет. Нужно ещё ${price - skandiCoins} S-монет. Побегайте ещё!`);
                }
            }

            // Отрисовка меню
            function renderMenu() {
                menuContainer.innerHTML = '';
                dishes.forEach(dish => {
                    const card = document.createElement('div');
                    card.className = 'dish-card';

                    card.innerHTML = `
                        <div class="dish-emoji">${dish.emoji}</div>
                        <div class="dish-name">${dish.name}</div>
                        <div class="dish-price">💰 ${dish.price}</div>
                        <div class="dish-desc">${dish.desc}</div>
                        <button class="buy-btn" data-id="${dish.id}">КУПИТЬ</button>
                    `;

                    const btn = card.querySelector('.buy-btn');
                    btn.addEventListener('click', () => buyDish(dish.price, dish.name));

                    menuContainer.appendChild(card);
                });
            }

            // Обновление баланса при фокусе и периодически
            window.addEventListener('focus', loadMoney);
            loadMoney();
            renderMenu();

            setInterval(loadMoney, 1000);
        })();
    </script>
</body>
</html>
