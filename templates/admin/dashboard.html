{% extends "admin/base.html" %}
{% block title %}Главная панель{% endblock %}
{% block content %}
<h2>Панель управления</h2>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card text-white bg-primary mb-3">
            <div class="card-body">
                <h5 class="card-title">Категории</h5>
                <p class="card-text display-4">{{ categories_count }}</p>
                <a href="{{ url_for('admin_categories') }}" class="btn btn-light">Управлять категориями</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-success mb-3">
            <div class="card-body">
                <h5 class="card-title">Блюда</h5>
                <p class="card-text display-4">{{ items_count }}</p>
                <a href="{{ url_for('admin_items') }}" class="btn btn-light">Управлять блюдами</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
