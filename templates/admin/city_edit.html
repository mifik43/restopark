{% extends "admin/base.html" %}
{% block title %}Редактирование города{% endblock %}
{% block content %}
<h2>Редактировать: {{ city.name }}</h2>
<form method="POST">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Название</label>
            <input type="text" name="name" value="{{ city.name }}" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Slug</label>
            <input type="text" name="slug" value="{{ city.slug }}" class="form-control" required>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Адрес</label>
        <input type="text" name="address" value="{{ city.address or '' }}" class="form-control">
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Часы работы</label>
            <input type="text" name="working_hours" value="{{ city.working_hours or '' }}" class="form-control">
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Телефон</label>
            <input type="text" name="phone" value="{{ city.phone or '' }}" class="form-control">
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Информация в футере</label>
        <textarea name="footer_info" class="form-control" rows="3">{{ city.footer_info or '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('admin_cities') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
