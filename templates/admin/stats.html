{% extends "admin/base.html" %}
{% block title %}Статистика игр{% endblock %}
{% block content %}
<h2>Активность по играм</h2>

<div class="row">
    <div class="col-md-6">
        <h4>Количество игр за период</h4>
        <canvas id="gamesChart"></canvas>
    </div>
    <div class="col-md-6">
        <h4>Среднее время игры (минут)</h4>
        <canvas id="durationChart"></canvas>
    </div>
</div>

<table class="table mt-4">
    <thead>
        <tr><th>Игра</th><th>Сегодня</th><th>Неделя</th><th>Месяц</th><th>Год</th><th>Ср. время (мин)</th></tr>
    </thead>
    <tbody id="statsTable"></tbody>
</table>
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{% endblock %}
