{% extends "admin/base.html" %}
{% block title %}Дашборд продаж{% endblock %}
{% block content %}
<h2>Аналитика продаж</h2>

<!-- Фильтр периода -->
<div class="row mb-4">
    <div class="col-md-4">
        <label for="periodSelect" class="form-label">Период</label>
        <select id="periodSelect" class="form-select" onchange="loadSalesData(this.value)">
            <option value="7">Последние 7 дней</option>
            <option value="30" selected>Последние 30 дней</option>
            <option value="90">Последние 3 месяца</option>
            <option value="365">За год</option>
        </select>
    </div>
    <div class="col-md-8 d-flex align-items-end">
        <div class="d-flex gap-3 ms-auto">
            <div class="bg-dark text-white p-2 rounded">
                <small>Заказов</small><br><strong id="totalOrders">0</strong>
            </div>
            <div class="bg-dark text-white p-2 rounded">
                <small>Выручка</small><br><strong id="totalRevenue">0 ₽</strong>
            </div>
            <div class="bg-dark text-white p-2 rounded">
                <small>Средний чек</small><br><strong id="avgCheck">0 ₽</strong>
            </div>
            <div class="bg-dark text-white p-2 rounded">
                <small>Ср. время готовки</small><br><strong id="avgCookingTime">0 мин</strong>
            </div>
        </div>
    </div>
</div>

<!-- Графики -->
<div class="row">
    <div class="col-lg-8 mb-4">
        <div class="card bg-dark text-white">
            <div class="card-header">Выручка по дням</div>
            <div class="card-body">
                <canvas id="revenueChart" height="300"></canvas>
            </div>
        </div>
    </div>
    <div class="col-lg-4 mb-4">
        <div class="card bg-dark text-white">
            <div class="card-header">Топ-10 блюд</div>
            <div class="card-body">
                <canvas id="topItemsChart" height="300"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
    let revenueChart, topItemsChart;

    function loadSalesData(days = 30) {
        fetch(`/api/sales/data?days=${days}`)
            .then(res => res.json())
            .then(data => {
                // Обновить метрики
                document.getElementById('totalOrders').textContent = data.total_orders;
                document.getElementById('totalRevenue').textContent = data.total_revenue.toLocaleString() + ' ₽';
                document.getElementById('avgCheck').textContent = data.avg_check + ' ₽';
                document.getElementById('avgCookingTime').textContent = data.avg_cooking_time + ' мин';

                // График выручки
                if (revenueChart) revenueChart.destroy();
                const ctx1 = document.getElementById('revenueChart').getContext('2d');
                revenueChart = new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: data.revenue_dates,
                        datasets: [{
                            label: 'Выручка (₽)',
                            data: data.revenue_values,
                            backgroundColor: 'rgba(54, 162, 235, 0.6)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, ticks: { color: 'white' } }, x: { ticks: { color: 'white' } } }
                    }
                });

                // Топ блюд
                if (topItemsChart) topItemsChart.destroy();
                const ctx2 = document.getElementById('topItemsChart').getContext('2d');
                topItemsChart = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: data.top_items_names,
                        datasets: [{
                            label: 'Продано (шт)',
                            data: data.top_items_qty,
                            backgroundColor: 'rgba(255, 159, 64, 0.6)',
                            borderColor: 'rgba(255, 159, 64, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: { x: { beginAtZero: true, ticks: { color: 'white' } }, y: { ticks: { color: 'white' } } }
                    }
                });
            });
    }

    // Загрузка при открытии
    loadSalesData(30);
</script>
{% endblock %}
